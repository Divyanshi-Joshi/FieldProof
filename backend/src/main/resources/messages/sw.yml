messages:
  CONFIRMED_PAYOUT: "Dai lako limeharakishwa kwa malipo kulingana na kulingana kwa fahirisi na picha za shamba."
  POSSIBLE_OVERPAYMENT: "Kipimo cha hali ya hewa kimewashwa, lakini picha za shamba zinahitaji ukaguzi zaidi kabla ya malipo."
  PHENOLOGICAL_BASIS_RISK_GAP: "Mvua ya msimu haikufikia kikomo cha malipo, lakini ukame mkali wakati wa kutoa maua umethibitishwa. Dai lako limeongezwa kwa ukaguzi wa afisa."
  SPATIAL_BASIS_RISK_GAP: "Kipimo cha hali ya hewa cha kaunti hakikuwashwa, lakini upungufu wa mvua kwenye shamba lako umethibitishwa. Dai lako limeongezwa."
  EVIDENCE_CONFLICT: "Ushahidi wa picha na data ya satelaiti unahitaji upatanisho wa afisa wa bima. Kesi yako inakaguliwa."
  NON_WEATHER_LOSS: "Uharibifu unasababishwa na wadudu au magonjwa, ambayo hayajalipwa chini ya bima ya ukame."
  CONSISTENT: "Picha za shamba na mvua ya msimu hazionyeshi hasara kubwa ya ukame."
  INTEGRITY_HOLD: "Dai limesitishwa kwa sababu ya picha zinazojirudia au masuala ya uthibitishaji. Afisa anachunguza."
  ABSTAIN: "Ukaguzi unahitaji uamuzi wa afisa wa bima."

photo_rejections:
  DUPLICATE_WITHIN_CLAIM: "Picha inayofanana imetumwa mara mbili katika dai hili."
  DUPLICATE_OF_EARLIER_CLAIM: "Picha hii inalingana na picha ya dai la awali."
  NOT_A_CROP_FIELD: "Picha iliyotumwa haionekani kuwa shamba la mazao."
  SCREEN_RECAPTURE: "Picha inaonekana imepigwa kutoka kwenye skrini ya simu au kompyuta."
  DIFFERENT_FIELD: "Picha zilizotumwa zinaonekana zimetoka kwenye mashamba tofauti."

disclaimer: "Taarifa ya maendeleo pekee. Uamuzi wa mwisho unafanywa pekee na afisa wa bima."
