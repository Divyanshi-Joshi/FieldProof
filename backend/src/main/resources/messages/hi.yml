messages:
  CONFIRMED_PAYOUT: "सूचकांक और खेत की तस्वीरों के मिलान के आधार पर आपके दावे को त्वरित भुगतान हेतु भेजा गया है।"
  POSSIBLE_OVERPAYMENT: "मौसम सूचकांक ट्रिगर हुआ है, परंतु भुगतान से पूर्व खेत की तस्वीरों की दोबारा समीक्षा आवश्यक है।"
  PHENOLOGICAL_BASIS_RISK_GAP: "मौसमी वर्षा का कुल योग सूचकांक से अधिक था, लेकिन फूल आने के नाजुक समय सूखे की पुष्टि हुई है। आपका दावा विशेष समीक्षा हेतु भेजा गया है।"
  SPATIAL_BASIS_RISK_GAP: "क्षेत्रीय मौसम सूचकांक ट्रिगर नहीं हुआ, परंतु आपके खेत में वर्षा की भारी कमी दर्ज की गई। आपका दावा समीक्षा में है।"
  EVIDENCE_CONFLICT: "तस्वीरों और उपग्रह डेटा में भिन्नता पाई गई है। एक मानव बीमा अधिकारी आपके मामले की जांच करेंगे।"
  NON_WEATHER_LOSS: "नुकसान गैर-मौसम कारणों (कीट, रोग या खरपतवार) से हुआ प्रतीत होता है, जो सूखा बीमा में शामिल नहीं है।"
  CONSISTENT: "खेत की तस्वीरों और मौसमी वर्षा के अनुसार कोई गंभीर सूखा क्षति दर्ज नहीं की गई है।"
  INTEGRITY_HOLD: "डुप्लीकेट तस्वीरों या सत्यापन त्रुटि के कारण दावा रोका गया है। मानव समीक्षक नियुक्त किया गया है।"
  ABSTAIN: "सत्यापन के लिए मानव बीमा समीक्षक की राय आवश्यक है।"

photo_rejections:
  DUPLICATE_WITHIN_CLAIM: "इस दावे में एक ही फोटो दो बार अपलोड की गई है।"
  DUPLICATE_OF_EARLIER_CLAIM: "यह फोटो किसी पुराने दावे की फोटो से मेल खाती है।"
  NOT_A_CROP_FIELD: "अपलोड की गई फोटो किसी फसल के खेत की नहीं लगती।"
  SCREEN_RECAPTURE: "यह फोटो किसी मोबाइल या कंप्यूटर स्क्रीन की खींची हुई लगती है।"
  DIFFERENT_FIELD: "अपलोड की गई तस्वीरें अलग-अलग खेतों की प्रतीत होती हैं।"

disclaimer: "यह केवल स्थिति सूचना है। अंतिम निर्णय प्रमाणित मानव बीमा अधिकारी द्वारा ही लिया जाता है।"
